<head>

  <meta name="theme-color" content="#FFFFFF">

  <meta property="og:title" content="Top Note — Encuentra tu aroma">

  <!-- El JSX ya no se compila en el navegador. Babel standalone eran 2,87 MB
       descargados y ejecutados en cada visita solo para traducir JSX; ahora la
       traduccion se hace una vez, al construir, y lo que se sirve es app.js.
       Fuente legible en topnote/src/app.jsx; se reconstruye con `npm run build`.
       Los cuatro guiones van diferidos: conservan el orden entre ellos y dejan
       de bloquear el pintado de la pantalla de carga. -->
  <script defer crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script defer crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Three.js UMD (r147 — última versión con build no-ESM). Expone window.THREE. -->
  <script defer src="https://unpkg.com/three@0.147.0/build/three.min.js"></script>
  <!-- Framer Motion UMD — expone window.Motion (motion, AnimatePresence, useInView…) -->
  <script defer src="https://cdn.jsdelivr.net/npm/framer-motion@11.11.17/dist/framer-motion.js"></script>
  <script defer src="/topnote/app.js"></script>
  <style>
    html, body { background: #FFFFFF; margin: 0; padding: 0; min-height: 100vh; font-family: "Geist", system-ui, sans-serif; }
    #root { min-height: 100vh; }
    .__boot {
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #6B7480; font-weight: 500;
      gap: 18px;
    }
    .__boot img {
      width: 110px; height: auto; display: block;
      opacity: 0.95;
      animation: __bootbreathe 2.6s ease-in-out infinite;
    }
    .__boot .__bw {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 26px; font-weight: 500; color: #0B0F19;
      letter-spacing: -0.005em;
      margin-top: -6px;
    }
    .__boot .__bw em { font-style: italic; color: #1B4D6E; }
    .__boot span {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase;
      color: #6B7480;
    }
    .__boot span::before {
      content: ""; width: 7px; height: 7px; border-radius: 50%;
      background: #4FB5E8; box-shadow: 0 0 0 4px rgba(79,181,232,0.18);
      animation: __bootping 1.8s infinite;
    }
    @keyframes __bootping {
      0% { box-shadow: 0 0 0 0 rgba(79,181,232,0.5); }
      70% { box-shadow: 0 0 0 9px rgba(79,181,232,0); }
      100% { box-shadow: 0 0 0 0 rgba(79,181,232,0); }
    }
    @keyframes __bootbreathe {
      0%, 100% { opacity: 0.7; transform: scale(0.98); }
      50%      { opacity: 1;   transform: scale(1); }
    }
  </style>
</head>
<body>
<div id="root">
  <div class="__boot">
    <img src="/topnote/assets/logo.png" alt="" aria-hidden="true" />
    <div class="__bw">Top <em>Note</em></div>
    <span>cargando</span>
  </div>
</div>

<script>
  /* ============================================================
     POLYFILLS — para correr el artifact en navegador estándar
     ============================================================ */
  // window.storage es API específica de Claude artifacts. Usamos localStorage como backend.
  window.storage = {
    async getItem(k)    { return localStorage.getItem(k); },
    async setItem(k, v) { localStorage.setItem(k, v); },
    async removeItem(k) { localStorage.removeItem(k); }
  };

  // La clave de Gemini vive en el servidor, nunca en el navegador: el front
  // habla con /api/recommendations/rank, que hace de proxy y aplica el limite
  // de uso de la demo. Aqui vivia ademas un window.claude.complete que apuntaba
  // a /api/gemini -- resto de cuando esto era un artifact de Claude. Ni esa
  // ruta existe ni app.jsx la llamaba: fuera.
  // Versiones antiguas guardaban la clave en el navegador. Se limpian.
  try {
    localStorage.removeItem('topnote.gemini_key');
    localStorage.removeItem('topnote.anthropic_key');
  } catch (e) { /* localStorage puede estar bloqueado */ }

  // Reset desde consola: resetTopNote()
  window.resetTopNote = function () {
    localStorage.removeItem('topnote.gemini_key');
    localStorage.removeItem('topnote.anthropic_key');   // legacy
    localStorage.removeItem('topnote.favorites.v1');
    localStorage.removeItem('topnote.history.v1');
    location.reload();
  };
</script>

<!-- la aplicacion entra por /topnote/app.js, diferida desde la cabecera -->

<!-- Vercel Web Analytics y Speed Insights: las rutas /_vercel/* las sirve la
     plataforma, asi que en local devuelven 404 sin consecuencias. -->
<script defer src="/_vercel/insights/script.js"></script>
<script defer src="/_vercel/speed-insights/script.js"></script>

</body>
</html>
